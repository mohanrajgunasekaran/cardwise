version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cardwise_postgres
    restart: always
    environment:
      POSTGRES_USER: cardwise_user
      POSTGRES_PASSWORD: cardwise_password
      POSTGRES_DB: cardwise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: cardwise_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cardwise_user:cardwise_password@db:5432/cardwise_db
      - SECRET_KEY=production-change-this-secret-key-cardwise-2026
    depends_on:
      - db

volumes:
  postgres_data:
